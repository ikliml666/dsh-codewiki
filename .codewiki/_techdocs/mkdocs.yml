site_name: dsh-codewiki
site_description: dsh-codewiki 是 DSH 插件 @ikliml666/dsh-codewiki，目标是把“为仓库生成或更新 CodeWiki”从一次同步调用，变成一条可观测、可恢复、可取消的后台任务。插件由宿主 Node 半侧与浏览器半侧组成：前者负责任务编排、引擎裁决、质量门、状态持久化与本机 HTTP…
repo_url: https://github.com/ikliml666/dsh-codewiki
edit_uri: ''
docs_dir: docs
nav:
- dsh-codewiki 仓库概览: index.md
- ui-client（浏览器半侧客户端）: ui-client.md
- 作业编排与状态管理（Job Orchestration & State Management）:
  - 作业编排与状态管理（Job Orchestration & State Management）: Job_Orchestration___State_Management.md
  - 插件编排层（plugin-orchestration）: Job_Orchestration___State_Management/plugin-orchestration.md
  - 作业状态与持久化层（job-and-state）: Job_Orchestration___State_Management/job-and-state.md
- Documentation_Generation_Engine 模块概览:
  - Documentation_Generation_Engine 模块概览: Documentation_Generation_Engine.md
  - engine-core 模块概览:
    - engine-core 模块概览: Documentation_Generation_Engine/engine-core.md
    - engine-orchestration 模块概览:
      - engine-orchestration 模块概览: Documentation_Generation_Engine/engine-core/engine-orchestration.md
      - apply-plan 落地器: Documentation_Generation_Engine/engine-core/engine-orchestration/apply-plan.md
      - engine-runner：原生引擎执行与裁决编排:
        - engine-runner：原生引擎执行与裁决编排: Documentation_Generation_Engine/engine-core/engine-orchestration/engine-runner.md
        - engine-runner 进程与协议层: Documentation_Generation_Engine/engine-core/engine-orchestration/engine-runner/engine-runner_process-protocol.md
        - engine-runner 原生编译流水线: Documentation_Generation_Engine/engine-core/engine-orchestration/engine-runner/engine-runner_native-pipeline.md
    - engine-contract-quality：引擎契约与质量裁决层: Documentation_Generation_Engine/engine-core/engine-contract-quality.md
    - 引擎外部集成层（模型桥与 TechDocs 回读）: Documentation_Generation_Engine/engine-core/engine-integrations.md
    - engine-state-manifest：引擎清单与跨轮受管状态: Documentation_Generation_Engine/engine-core/engine-state-manifest.md
    - 引擎运行时工具层（engine-runtime-utils）: Documentation_Generation_Engine/engine-core/engine-runtime-utils.md
  - 文章流水线（article-pipeline）: Documentation_Generation_Engine/article-pipeline.md
- Execution_Runtime___Vendored_Engine 概览:
  - Execution_Runtime___Vendored_Engine 概览: Execution_Runtime___Vendored_Engine.md
  - engine-python-runtime：FSoft 原生引擎的 Python 侧运行时: Execution_Runtime___Vendored_Engine/engine-python-runtime.md
  - codewiki-vendor（仓库内 vendored cw CLI）: Execution_Runtime___Vendored_Engine/codewiki-vendor.md
- 构建与开发基础设施（Build___Development_Infrastructure）概述:
  - 构建与开发基础设施（Build___Development_Infrastructure）概述: Build___Development_Infrastructure.md
  - 构建与配置（build-configuration）: Build___Development_Infrastructure/build-configuration.md
  - FSoft 引擎工具链（fsoft-engine-tools）: Build___Development_Infrastructure/fsoft-engine-tools.md
plugins:
- techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
