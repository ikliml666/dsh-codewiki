# dsh-codewiki — CodeWiki (mraza007/codewiki) for DeepSeek Harness
# （0.13.0 起吸入了 FSoft-AI4Code/CodeWiki 的 AST 聚类 / agentic 写作 / 符号级增量三层能力）
# 挂载方式：本文件供 bundle 形式安装用；本地开发走 profiles/web/cordis.patch.yml 的
# file:/// 直挂（URL 中空格写 %20），二者保持 id 一致：codewiki。
# 设置项（config 命名空间 = codewiki）：
#   binaryPath:      cw 可执行文件路径；留空优先用 PATH 里的 cw，找不到再用插件自带 bin/cw.exe
#   batchProvider:   编译模型提供商（必须是模型设置里已注册的 provider；默认 workbuddy，留空=提交失败）
#   batchModel:      编译模型 id（默认 hy3，免费 192k 上下文）
#   batchReasoningEffort: 思考程度档位（取值来自模型目录 reasoning.efforts；留空=模型默认档）
#   maxConcurrency:  默认档并发上限（1–8，默认 2）
#   bigConcurrency:  大档并发上限（1–8，默认 0=跟随默认档）：与默认档各自独立限流、同时推进
#   serialProjects:  单项目串行（默认开；同一时刻只推进一个仓库的编译任务，其余排队）
#   articleLanguage: 文章语言（默认中文）
#   planMode:        模块划分：auto=AST 符号 + LLM 语义聚类（默认）｜dirs=顶层目录分组（旧行为）
#   agenticArticles: 文章写作走 agentic 工具循环（默认开）：模型自己 read_code/edit_article，不整包内联
#   agenticMaxSteps: agentic 单篇步数上限（默认 30，1–100）
#   symbolIncremental: 增量按 AST 符号级判定（默认开）：只重写接口真变了的模块，注释/空白改动跳过
#   updateReminder:  会话系统提示注入 wiki 维护提醒（仅当会话仓库存在 .codewiki/；默认开）
- insert:
    - id: codewiki
      name: file:///E:/ik/Documents/trae_projects/1/dsh%20plugin/dsh-codewiki/index.js
      config: {}
